name: 🚀 Deploy to Cloudflare Pages (Preview)

on:
  push:
    branches-ignore:
      - main  # main → Vercel only
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    name: Cloudflare Pages Preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_ENV: preview

      - name: Deploy to Cloudflare Pages
        id: cf-deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nextjs-preview          # nom du projet dans Cloudflare Pages
          directory: out                        # dossier de sortie Next.js static export
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}

      - name: 🔗 Post preview URL as comment (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Cloudflare Pages Preview\n\n✅ Déployé avec succès !\n\n🔗 **URL de prévisualisation :** ${{ steps.cf-deploy.outputs.url }}\n\n*Mis à jour automatiquement à chaque push.*`
            })
