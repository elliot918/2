name: 📸 Playwright Screenshots

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    name: Capture screenshots

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build

      - name: Start server & capture screenshots
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Attendre que le serveur soit prêt
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 > /dev/null && break
            echo "Waiting for server... ($i)"
            sleep 2
          done
          node scripts/playwright-screenshot.js http://localhost:3000

      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

      # Pousse les screenshots sur une branche dédiée pour un accès HTTP direct
      - name: Publish screenshots to branch
        id: publish
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH="screenshots/preview-${SHORT_SHA}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan branch → aucune histoire, juste les images
          git checkout --orphan "$BRANCH"
          git rm -rf . --quiet 2>/dev/null || true

          cp -r screenshots .
          git add screenshots/
          git commit -m "📸 Screenshots for ${SHORT_SHA}"
          git push --force origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Upload screenshots artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.publish.outputs.short_sha }}
          path: screenshots/
          retention-days: 7

      # Commentaire PR avec les images embarquées
      - name: Post PR comment with screenshots
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha    = '${{ steps.publish.outputs.short_sha }}';
            const branch = '${{ steps.publish.outputs.branch }}';
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/screenshots`;

            const images = [
              { label: '🖥️ Desktop',  file: 'home-desktop.png' },
              { label: '📱 Mobile',   file: 'home-mobile.png'  },
            ];

            const rows = images.map(({ label, file }) =>
              `| ${label} | ![${label}](${rawBase}/${file}) |`
            ).join('\n');

            const body = [
              '## 📸 Playwright Screenshots',
              '',
              `> Commit \`${sha}\` — [Voir le workflow](${runUrl})`,
              '',
              '| Viewport | Aperçu |',
              '|----------|--------|',
              rows,
              '',
              '---',
              '**Pour déployer sur Vercel**, approuve le job dans',
              `[⚙️ Actions → Deploy to Vercel](https://github.com/${owner}/${repo}/actions/workflows/deploy-vercel.yml)`,
              'ou demande à Claude de lancer `/preview-deploy` en session Claude Code.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body,
            });
