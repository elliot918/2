name: 🚀 Deploy to Vercel (Production)

# Déclenché manuellement UNIQUEMENT — valide d'abord les screenshots Playwright,
# puis lance ce workflow depuis l'onglet Actions de GitHub.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch ou SHA à déployer (défaut : main)'
        required: false
        default: 'main'

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    name: Vercel Production Deploy
    # 🔒 Ce job attend une approbation manuelle dans l'environnement "production".
    # Configure-le dans :
    # GitHub → Settings → Environments → production → Required reviewers → ton pseudo
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: ✅ Summary
        run: |
          echo "## 🚀 Déploiement Vercel Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **URL de production :** ${{ steps.vercel-deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ref déployé : \`${{ inputs.ref || 'main' }}\`" >> $GITHUB_STEP_SUMMARY
